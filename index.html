<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <!-- O "0" define que o redirecionamento será imediato -->
    <meta http-equiv="refresh" content="0; url=https://SEU-LINK-DE-DESTINO.com">
    
    <!-- Fallback em JavaScript para garantir que funcione em todos os navegadores -->
    <script type="text/javascript">
        window.location.href = "https://SEU-LINK-DE-DESTINO.com"
    </script>
    
    <title>Redirecionando...</title>
  </head>
  <body>
    <!-- Mensagem de segurança caso o navegador bloqueie o redirecionamento automático -->
    <p>Se você não for redirecionado automaticamente, <a href="https://SEU-LINK-DE-DESTINO.com">clique aqui</a>.</p>
  </body>
</html>
